<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">RF</span><span><strong>Rahi Da Fey</strong><small>Guitar Player & Songwriter</small></span></a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="site-nav" aria-label="Primary navigation">

    </nav>
  </header>
  <main>
    <section class="section">
      <h1>Contact Us</h1>
      <div class="content-block">
        <form id="contactForm" name="contactForm" action="/api/contact" method="post" novalidate>
          <div class="form-group">
            <label class="label" for="name">Your Name *</label>
            <input class="input" type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label class="label" for="email">Your Email *</label>
            <input class="input" type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label class="label" for="subject">Subject *</label>
            <input class="input" type="text" id="subject" name="subject" required>
          </div>
          <div class="form-group">
            <label class="label" for="message">Your Message *</label>
            <textarea class="input" id="message" name="message" rows="6" required></textarea>
          </div>
          <button class="button primary contact-button" type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>Rahi Da Fey | Guitar Player & Songwriter</p><p><a href="privacy-policy.html">Privacy Policy</a> <a href="return-refund.html">Return & Refund</a></p></footer>
